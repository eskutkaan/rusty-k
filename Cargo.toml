[package]
name = "rusty-k"
version = "0.1.0"
edition = "2021"
description = "K-mer counter with tandem-repeat and repetitive-region detection for genome assemblies"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
needletail = "0.5"
rayon = "=1.8.1"
fxhash = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
indicatif = "0.17"
log = "0.4"
env_logger = "0.10"
thiserror = "1.0"
num_cpus = "1.16"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
